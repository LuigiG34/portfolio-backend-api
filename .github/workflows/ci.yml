name: CI/CD Portfolio API

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # ── Quality ───────────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, amqp, redis, gd
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse --level=8 src

  # ── Tests ─────────────────────────────────────────────────────
  tests:
    runs-on: ubuntu-latest
    needs: quality

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portfolio_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, amqp, redis, gd
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem -pkeyopt rsa_keygen_bits:4096
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem

      - name: Create test DB schema
        env:
          APP_ENV: test
          DATABASE_URL: mysql://app:app@127.0.0.1:3306/portfolio?serverVersion=8.0
        run: |
          php bin/console doctrine:schema:create --env=test

      - name: Run tests
        env:
          APP_ENV: test
          APP_SECRET: test_secret
          DATABASE_URL: mysql://app:app@127.0.0.1:3306/portfolio?serverVersion=8.0
          JWT_SECRET_KEY: config/jwt/private.pem
          JWT_PUBLIC_KEY: config/jwt/public.pem
          JWT_PASSPHRASE: ""
          MESSENGER_TRANSPORT_DSN: in-memory://
          MAILER_DSN: null://null
          CORS_ALLOW_ORIGIN: "^https?://localhost"
          EMAIL_TO: test@test.com
        run: vendor/bin/phpunit --testdox

  # ── Deploy ────────────────────────────────────────────────────
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
          tools: composer:v2

      - name: Install prod dependencies
        env:
          APP_ENV: prod
          APP_DEBUG: 0
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY:  ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y rsync
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -lf ~/.ssh/id_ed25519
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -p "${SSH_PORT:-22}" -o IdentitiesOnly=yes "${SSH_USER}@${SSH_HOST}" "echo SSH_OK"
          rsync -az --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="var/cache/*" \
            --exclude="var/log/*" \
            --exclude=".env" \
            --exclude=".env.test" \
            --exclude=".env.local" \
            --exclude="public/images/*" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT:-22} -o IdentitiesOnly=yes" \
            ./ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}"

      - name: Post-deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
              set -eux
              cd "${{ secrets.REMOTE_PATH }}"

              # Write .env.local with all prod secrets
              cat > .env.local <<'EOF'
              APP_ENV=prod
              APP_DEBUG=0
              APP_SECRET=${{ secrets.APP_SECRET }}
              DATABASE_URL="mysql://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@${{ secrets.DB_HOST }}:3306/${{ secrets.DB_NAME }}?serverVersion=8.0&charset=utf8mb4"
              JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
              JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
              JWT_PASSPHRASE=${{ secrets.JWT_PASSPHRASE }}
              MESSENGER_TRANSPORT_DSN=${{ secrets.MESSENGER_TRANSPORT_DSN }}
              MAILER_DSN=${{ secrets.MAILER_DSN }}
              CORS_ALLOW_ORIGIN=${{ secrets.CORS_ALLOW_ORIGIN }}
              EMAIL_TO=${{ secrets.EMAIL_TO }}
              EOF

              # Generate JWT keys if they don't exist
              if [ ! -f config/jwt/private.pem ]; then
                mkdir -p config/jwt
                openssl genpkey -algorithm RSA \
                  -out config/jwt/private.pem \
                  -pkeyopt rsa_keygen_bits:4096 \
                  -pass pass:${{ secrets.JWT_PASSPHRASE }}
                openssl rsa \
                  -pubout \
                  -in config/jwt/private.pem \
                  -out config/jwt/public.pem \
                  -passin pass:${{ secrets.JWT_PASSPHRASE }}
              fi

              /opt/alt/php83/usr/bin/php -v
              ls -la
              ls -la config/jwt || true
              /opt/alt/php83/usr/bin/php bin/console about --env=prod

              /opt/alt/php83/usr/bin/php bin/console cache:clear --env=prod
              /opt/alt/php83/usr/bin/php bin/console cache:warmup --env=prod
              /opt/alt/php83/usr/bin/php bin/console doctrine:migrations:migrate --no-interaction --env=prod
